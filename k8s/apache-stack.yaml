# k8s/apache-stack.yaml
apiVersion: v1
kind: Namespace
metadata:
  name: web-workload

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: apache-server
  namespace: web-workload
spec:
  replicas: 2
  selector:
    matchLabels:
      app: apache
  template:
    metadata:
      labels:
        app: apache
    spec:
      containers:
        - name: apache
          image: httpd:latest
          ports:
            - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: apache-service
  namespace: web-workload
spec:
  type: NodePort
  selector:
    app: apache
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30100