# Implementación de Namespace aislado para limitar el radio de explosión (Blast Radius).
apiVersion: v1
kind: Namespace
metadata:
  name: web-workload

---
# Declaración de la carga de trabajo garantizando idempotencia y Zero-Downtime.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: apache-server
  namespace: web-workload
  labels:
    app: apache
spec:
  # Garantiza alta disponibilidad; nunca depender de una sola instancia.
  replicas: 2
  # Zero-Downtime Deployment: Asegura que al menos 1 pod esté vivo durante las actualizaciones.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app: apache
  template:
    metadata:
      labels:
        app: apache
    spec:
      containers:
        # Uso de imagen Alpine para reducir superficie de ataque (distroless/minimal).
        - name: apache
          image: httpd:alpine
          ports:
            - containerPort: 80
          # Principio de Privilegio Mínimo: Evita escalada de privilegios en el nodo host.
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: false # Apache httpd oficial requiere root inicial para bindear el puerto 80, luego hace drop a www-data. En un entorno 100% hardened usaríamos un puerto >1024 y runAsNonRoot: true.
          # Liveness y Readiness probes: El LoadBalancer/Ingress no enviará tráfico si el pod no está listo.
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            # Prevención de ruidosos vecinos (Noisy Neighbors) limitando CPU y Memoria.
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"

---
# Exposición del servicio anclado al puerto corregido 30100.
apiVersion: v1
kind: Service
metadata:
  name: apache-service
  namespace: web-workload
spec:
  # NodePort para acceso directo a la VM del Sandbox (como dicta la arquitectura de EA2).
  type: NodePort
  selector:
    app: apache
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      # Puerto corregido. Debe estar entre 30000 y 32767.
      nodePort: 30100