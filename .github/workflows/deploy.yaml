name: "Secured Apache Deployment"

on:
  push:
    branches:
      - main
    paths:
      - 'k8s/**'
      - '.github/workflows/**'
  workflow_dispatch:
    inputs:
      # Permite inyectar la IP manualmente si cambia la máquina en el futuro
      server_ip:
        description: 'IP pública del servidor K3s existente'
        required: false
        type: string

# Principio de Privilegio Mínimo
permissions:
  contents: read
  id-token: write

jobs:
  # Job 1: Shift-Left Security. Escanea manifiestos.
  security-scan:
    name: "IaC & Container Security Scan"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4

      - name: "Trivy Vulnerability Scanner (IaC)"
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          hide-progress: false
          format: 'table'
          # Modo informativo para evitar bloqueos en fase de pruebas
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

  # ELIMINADO: Job 'provision-infra'. Ya no aprovisionamos infraestructura en cada push.

  # Job 2 (Antes Job 3): Despliegue directo sobre Infraestructura Existente.
  deploy-workload:
    name: "Deploy Apache & Verify"
    needs: security-scan # Ahora depende directamente del escaneo de seguridad
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4

      # Arquitectura Estática: Usamos la variable guardada en el repo o el input manual.
      - name: "Set Server IP"
        run: |
          # Prioridad 1: Input manual (workflow_dispatch)
          # Prioridad 2: Variable de entorno del repositorio
          # Prioridad 3: Fallo rápido si no hay ninguna
          
          FINAL_IP="${{ github.event.inputs.server_ip || vars.K3S_SERVER_PUBLIC_IP }}"
          
          if [ -z "$FINAL_IP" ]; then
            echo "❌ ERROR: No se ha definido la IP del servidor."
            echo "Debes configurar la variable de repositorio 'K3S_SERVER_PUBLIC_IP' o proveerla al ejecutar el workflow manualmente."
            exit 1
          fi
          
          echo "SERVER_IP=$FINAL_IP" >> $GITHUB_ENV
          echo "✅ Desplegando en la infraestructura existente: $FINAL_IP"

      - name: "Setup SSH Agent"
        uses: webfactory/ssh-agent@v0.9.0
        with:
          # Requiere que el secreto EA2_SSH_PRIVATE_KEY coincida con la llave pública instalada en la EC2 existente.
          ssh-private-key: ${{ secrets.EA2_SSH_PRIVATE_KEY }}

      - name: "Apply K8s Manifests"
        run: |
          # 0. Validación Pre-Flight (Fail-Fast)
          if [ ! -f "k8s/apache-stack.yaml" ]; then
            echo "❌ ERROR CRÍTICO: El artefacto k8s/apache-stack.yaml no existe en el repositorio."
            exit 1
          fi

          # 1. Copia segura de manifiestos a la EC2 existente
          ssh -o StrictHostKeyChecking=accept-new "ubuntu@${SERVER_IP}" 'mkdir -p /tmp/k8s-apache'
          scp -o StrictHostKeyChecking=accept-new k8s/apache-stack.yaml "ubuntu@${SERVER_IP}:/tmp/k8s-apache/apache-stack.yaml"
          
          # 2. Ops: Asegurar el Namespace e inyectar credenciales Docker localmente (Idempotente)
          ssh -o StrictHostKeyChecking=accept-new "ubuntu@${SERVER_IP}" \
            "sudo k3s kubectl create namespace web-workload --dry-run=client -o yaml | sudo k3s kubectl apply -f -"
          
          # NOTA: La inyección de secretos es idempotente. Si ya existe, lo borra y lo recrea.
          ssh -o StrictHostKeyChecking=accept-new "ubuntu@${SERVER_IP}" \
            "sudo k3s kubectl delete secret dockerhub-cred -n web-workload --ignore-not-found && \
             sudo k3s kubectl create secret docker-registry dockerhub-cred \
               --docker-server=https://index.docker.io/v1/ \
               --docker-username='${{ secrets.DOCKER_USERNAME }}' \
               --docker-password='${{ secrets.DOCKER_PASSWORD }}' \
               --docker-email=noreply@local -n web-workload && \
             sudo k3s kubectl patch serviceaccount default -n web-workload -p '{\"imagePullSecrets\":[{\"name\":\"dockerhub-cred\"}]}'"
          
          # 3. Aplicación declarativa (Idempotente: Si no cambiaste el YAML, no hará nada. Si cambiaste la imagen, actualizará los pods).
          ssh -o StrictHostKeyChecking=accept-new "ubuntu@${SERVER_IP}" \
            'sudo k3s kubectl apply -f /tmp/k8s-apache/apache-stack.yaml'
          
          # 4. Validación de Zero-Downtime
          ssh -o StrictHostKeyChecking=accept-new "ubuntu@${SERVER_IP}" \
            'sudo k3s kubectl rollout status deployment/apache-server -n web-workload --timeout=180s'

      - name: "Rollback on Failure"
        if: failure()
        run: |
          echo "⚠️ Despliegue fallido. Capturando estado de los Pods para diagnóstico (Shift-Left Troubleshooting):"
          ssh -o StrictHostKeyChecking=accept-new "ubuntu@${SERVER_IP}" \
            'sudo k3s kubectl describe pods -n web-workload && sudo k3s kubectl logs -l app=apache -n web-workload --tail=50 || true'

          echo "🔄 Iniciando rollback automático para proteger el estado de producción."
          ssh -o StrictHostKeyChecking=accept-new "ubuntu@${SERVER_IP}" \
            'sudo k3s kubectl rollout undo deployment/apache-server -n web-workload || echo "⚠️ Rollback abortado: El Deployment no existía previamente (Día Cero)."'
          exit 1