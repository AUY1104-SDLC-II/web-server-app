name: "Secured Apache Deployment"

on:
  push:
    branches:
      - main
    paths:
      - 'k8s/**'
      - '.github/workflows/**'
  workflow_dispatch:

# Principio de Privilegio Mínimo
permissions:
  contents: read
  id-token: write

jobs:
  # Job 1: Shift-Left Security. Escanea manifiestos antes de aprovisionar.
  security-scan:
    name: "IaC & Container Security Scan"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4

      - name: "Trivy Vulnerability Scanner (IaC)"
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          hide-progress: false
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'

  # Job 2: Aprovisionamiento de Infraestructura delegada.
  provision-infra:
    name: "Provision Sandbox"
    needs: security-scan
    uses: asanchezo-duoc/AUY1104-SharedWorkflows/.github/workflows/ea2-provision-k8s-sandbox.yaml@EA2
    with:
      aws_region: us-east-1
      instance_type: t3.small
      k8s_stack: k3s
      k8s_api_cidr_ipv4: 0.0.0.0/0
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      EA2_SSH_PRIVATE_KEY: ${{ secrets.EA2_SSH_PRIVATE_KEY }}
      # PREVENCIÓN DE RATE LIMITS: Inyección de credenciales Docker para asegurar pulls en K3s
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

  # Job 3: Despliegue de la Carga de Trabajo con validación de estado y Rollback automático.
  deploy-workload:
    name: "Deploy Apache & Verify"
    needs: provision-infra
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4

      - name: "Setup SSH Agent"
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EA2_SSH_PRIVATE_KEY }}

      - name: "Apply K8s Manifests"
        env:
          # Se inyecta la IP registrada hace 1 hora en tus variables de repositorio
          SERVER_IP: ${{ vars.K3S_SERVER_PUBLIC_IP }}
        run: |
          # 1. Preparación de ruta explícita y copia 1:1 para evitar duplicación de carpetas
          ssh -o StrictHostKeyChecking=accept-new "ubuntu@${SERVER_IP}" 'mkdir -p /tmp/k8s-apache'
          scp -o StrictHostKeyChecking=accept-new k8s/apache-stack.yaml "ubuntu@${SERVER_IP}:/tmp/k8s-apache/apache-stack.yaml"
          
          # 2. Aplicación declarativa
          ssh -o StrictHostKeyChecking=accept-new "ubuntu@${SERVER_IP}" \
            'sudo k3s kubectl apply -f /tmp/k8s-apache/apache-stack.yaml'
          
          # 3. Validación de Zero-Downtime
          ssh -o StrictHostKeyChecking=accept-new "ubuntu@${SERVER_IP}" \
            'sudo k3s kubectl rollout status deployment/apache-server -n web-workload --timeout=90s'

      - name: "Rollback on Failure"
        if: failure()
        env:
          SERVER_IP: ${{ vars.K3S_SERVER_PUBLIC_IP }}
        run: |
          echo "Despliegue fallido. Iniciando rollback automático para proteger el estado de producción."
          # Tolerancia a fallos: Si el namespace no existe (Ej: fallo en el primer despliegue), se notifica sin romper la tubería de error
          ssh -o StrictHostKeyChecking=accept-new "ubuntu@${SERVER_IP}" \
            'sudo k3s kubectl rollout undo deployment/apache-server -n web-workload || echo "⚠️ Rollback abortado: El Deployment no existía previamente (Día Cero)."'
          
          # Se mantiene el código de salida fallido para que GitHub Actions marque el job en rojo
          exit 1